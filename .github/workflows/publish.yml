name: Publish Extension

# Publishes the extension to the VS Code Marketplace and Open VSX.
# Triggered by pushing a version tag (e.g. `git tag v0.1.1 && git push --tags`),
# or manually from the Actions tab.
#
# Uses the official CLIs directly (@vscode/vsce + ovsx) instead of a third-party
# wrapper action, so everything runs on the Node version we set up (no deprecated
# action runtimes) and on the latest official tooling.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Native vector-DB / tree-sitter modules are not needed to build or publish
      # the extension (webpack externalizes them; they load lazily at runtime),
      # so skip install scripts — faster, and no native prebuild concerns.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build core engine
        run: npm run build:core

      # Package the .vsix once, then publish that exact artifact to both registries.
      - name: Package extension
        working-directory: packages/vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies -o ai-search.vsix

      - name: Publish to VS Code Marketplace
        working-directory: packages/vscode-extension
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath ai-search.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        working-directory: packages/vscode-extension
        run: npx --yes ovsx publish ai-search.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
