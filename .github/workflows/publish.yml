name: Publish Extension

# Publishes the extension to the VS Code Marketplace and Open VSX.
# Triggered by pushing a version tag (e.g. `git tag v0.1.1 && git push --tags`),
# or manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # HaaLeo/publish-vscode-extension still ships on the Node 20 action runtime.
  # Force every JS action to run on the Node 24 runtime so nothing uses the
  # deprecated Node 20 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # The native vector-DB / tree-sitter modules are NOT needed to build or
      # publish the extension: webpack externalizes them and they are loaded
      # lazily at runtime. Skipping install scripts avoids compiling native
      # binaries, which keeps the build fast and lets it run on the latest Node.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build core engine
        run: npm run build:core

      # Packages the .vsix once (runs the extension's webpack build via
      # vscode:prepublish) and publishes it to Open VSX. The packaged file path
      # is exported so the next step reuses the exact same artifact.
      - name: Publish to Open VSX
        id: openvsx
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          packagePath: packages/vscode-extension
          dependencies: false

      - name: Publish to VS Code Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.openvsx.outputs.vsixPath }}
          dependencies: false
